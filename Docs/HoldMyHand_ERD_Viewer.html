  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .header-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title p {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      padding: 6px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: #334155; border-color: #38bdf8; }
    .btn-primary { background: #0284c7; border-color: #38bdf8; font-weight: 600; }
    .btn-primary:hover { background: #0369a1; }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      background: #0f172a;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #1e293b;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .badge-dot { width: 10px; height: 10px; border-radius: 50%; }

    #viewport {
      flex: 1;
      position: relative;
      cursor: grab;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1px, transparent 0);
      background-size: 24px 24px;
    }
    #viewport:active { cursor: grabbing; }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
      width: 2400px;
      height: 1200px;
    }

    svg.connections {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .entity-card {
      position: absolute;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 10;
      font-size: 11px;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .entity-card:hover {
      border-color: #38bdf8;
      box-shadow: 0 12px 32px rgba(56, 189, 248, 0.25);
      z-index: 20;
    }
    .entity-card.hub {
      border: 2px solid #f59e0b;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.45);
      z-index: 15;
    }
    .entity-card.hub:hover {
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.7);
    }

    .entity-header {
      padding: 6px 10px;
      font-weight: 700;
      font-size: 11px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .entity-body {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .field-row {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }
    .field-name { display: flex; align-items: center; gap: 4px; }
    .tag-pk { color: #fbbf24; font-weight: 700; }
    .tag-fk { color: #60a5fa; font-weight: 700; }
    .tag-new-fk { color: #f97316; font-weight: 700; background: rgba(249,115,22,0.15); padding: 0 3px; border-radius: 3px; }
    .field-type { color: #64748b; font-family: monospace; font-size: 10px; }

    /* SVG edge styling */
    .edge-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke-width 0.2s, stroke 0.2s;
    }
    .edge-label {
      font-size: 9px;
      fill: #94a3b8;
      font-family: monospace;
      paint-order: stroke;
      stroke: #090d16;
      stroke-width: 3px;
    }
    .edge-line.highlight {
      stroke-width: 3.5px !important;
      filter: drop-shadow(0 0 6px currentColor);
    }
  </style>
</head>

    const container = document.getElementById('entitiesContainer');
    const svg = document.getElementById('svgConnections');
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');

    let scale = 0.85;
    let panX = 40;
    let panY = 20;
    let isDragging = false;
    let startX, startY;

    function renderEntities() {
      container.innerHTML = '';
      data.entities.forEach(ent => {
        const div = document.createElement('div');
        div.className = 'entity-card' + (ent.isHub ? ' hub' : '');
        div.id = 'node-' + ent.id;
        div.style.left = ent.x + 'px';
        div.style.top = ent.y + 'px';
        div.style.width = ent.w + 'px';

        let fieldsHtml = ent.fields.map(f => {
          let tag = '';
          if (f.isPk) tag = '<span class="tag-pk">[PK]</span>';
          else if (f.isFk && f.isNew) tag = '<span class="tag-new-fk">[FK*]</span>';
          else if (f.isFk) tag = '<span class="tag-fk">[FK]</span>';
          return `
            <div class="field-row">
              <span class="field-name">${tag} ${f.name}</span>
              <span class="field-type">${f.type}</span>
            </div>
          `;
        }).join('');

        div.innerHTML = `
          <div class="entity-header" style="background:${ent.headerColor}">
            <span>${ent.title}</span>
          </div>
          <div class="entity-body">
            ${fieldsHtml}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderEdges() {
      svg.innerHTML = '';
      data.edges.forEach(edge => {
        const fromEnt = data.entities.find(e => e.id === edge.from);
        const toEnt = data.entities.find(e => e.id === edge.to);
        if (!fromEnt || !toEnt) return;

        // Calculate anchors
        const p1 = { x: fromEnt.x + fromEnt.w / 2, y: fromEnt.y + fromEnt.h / 2 };
        const p2 = { x: toEnt.x + toEnt.w / 2, y: toEnt.y + toEnt.h / 2 };

        let stroke = '#52525b';
        let strokeWidth = 1.2;
        let strokeDash = '';

        if (edge.isCore && edge.isNew) {
          stroke = '#f59e0b';
          strokeWidth = 2.5;
          strokeDash = '5,4';
        } else if (edge.isCore) {
          stroke = '#38bdf8';
          strokeWidth = 2;
        } else if (edge.isNew) {
          stroke = '#ec4899';
          strokeWidth = 1.8;
          strokeDash = '4,4';
        }

        // Mid curve or orthogonal
        const midY = (p1.y + p2.y) / 2;
        const d = `M ${p1.x} ${p1.y} C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y}`;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', 'edge-line' + (edge.isCore ? ' core-edge' : ''));
        path.setAttribute('stroke', stroke);
        path.setAttribute('stroke-width', strokeWidth);
        if (strokeDash) path.setAttribute('stroke-dasharray', strokeDash);
        svg.appendChild(path);

        if (edge.label) {
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', (p1.x + p2.x) / 2);
          text.setAttribute('y', midY);
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('class', 'edge-label');
          text.textContent = edge.label;
          svg.appendChild(text);
        }
      });
    }

    function updateTransform() {
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function zoomIn() { scale = Math.min(2.0, scale + 0.1); updateTransform(); }
    function zoomOut() { scale = Math.max(0.4, scale - 0.1); updateTransform(); }
    function resetView() {
      scale = 0.8;
      panX = 30;
      panY = 15;
      updateTransform();
    }

    viewport.addEventListener('mousedown', e => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });
    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      scale = Math.max(0.4, Math.min(2.0, scale * zoomFactor));
      updateTransform();
    });

    renderEntities();
    renderEdges();
    updateTransform();
  </script>
